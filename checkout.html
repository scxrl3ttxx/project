<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serenity Checkout</title>
    <link rel="stylesheet" href="./styles/checkout.css">
    <link rel="stylesheet" href="./styles/chat-widget.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="checkout-header">
        <div class="logo-area">
            <a href="./main.html" class="brand-name"><strong>SERENITY</strong> CHECKOUT</a>
        </div>
        <nav class="nav-links" aria-label="Checkout Navigation">
            <a href="./main.html" class="continue-browsing">Continue Browsing</a>
        </nav>
    </header>

    <main class="checkout-container">
        <input type="checkbox" id="summary-toggle" class="summary-toggle-checkbox">
        <label for="summary-toggle" class="mobile-summary-bar">
            <div class="summary-toggle-text">
                <span class="show-text">Show summary</span>
                <span class="hide-text">Hide summary</span>
                <svg class="chevron-icon" viewBox="0 0 12 8" width="12" height="8" fill="none" stroke="currentColor" stroke-width="1.2">
                    <path d="M1 1.5L6 6.5L11 1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <span class="mobile-bar-price">$35.00</span>
        </label>
        <section class="checkout-left">
            <div class="payment-message-box">
                <button class="modal-close-icon" aria-label="Close message">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="28" height="28" aria-hidden="true">
                        <path d="M12.0002 11.2929L14.8286 8.46447L15.5357 9.17157L12.7073 12L15.5357 14.8284L14.8286 15.5355L12.0002 12.7071L9.17176 15.5355L8.46466 14.8284L11.2931 12L8.46466 9.17157L9.17176 8.46447L12.0002 11.2929Z"></path>
                        <path fill-rule="evenodd" d="M20.5 12C20.5 16.6944 16.6944 20.5 12 20.5C7.30558 20.5 3.5 16.6944 3.5 12C3.5 7.30558 7.30558 3.5 12 3.5C16.6944 3.5 20.5 7.30558 20.5 12ZM19.5 12C19.5 16.1421 16.1421 19.5 12 19.5C7.85786 19.5 4.5 16.1421 4.5 12C4.5 7.85786 7.85786 4.5 12 4.5C16.1421 4.5 19.5 7.85786 19.5 12Z" clip-rule="evenodd"></path>
                    </svg>
                </button>
                <h2>We can't accept online payments</h2>
                <p>Contact us for help with your order.</p>
            </div>
        </section>

        <section class="checkout-right">
            <div class="order-summary-header">
                <h3>Order summary (1 item)</h3>
                <button class="edit-cart-btn" aria-label="Edit cart">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24" aria-hidden="true">
                        <path fill-rule="evenodd" d="M18.8525,7.543 L17.7515,8.644 L15.3565,6.248 L16.4575,5.147 C16.5555,5.05 16.6835,5.001 16.8105,5.001 C16.9385,5.001 17.0665,5.05 17.1645,5.147 L18.8525,6.835 C19.0475,7.03 19.0475,7.348 18.8525,7.543 L18.8525,7.543 Z M8.1895,18.206 C8.1185,18.276 8.0275,18.324 7.9295,18.344 L5.1275,18.873 L5.6575,16.07 C5.6755,15.972 5.7225,15.882 5.7945,15.811 L14.6495,6.955 L17.0445,9.351 L8.1895,18.206 Z M19.5595,6.128 L17.8715,4.44 C17.2865,3.856 16.3355,3.856 15.7505,4.44 L5.0875,15.103 C4.8735,15.317 4.7295,15.588 4.6745,15.886 L4.0085,19.407 C3.9775,19.569 4.0295,19.736 4.1465,19.854 C4.2415,19.948 4.3685,20 4.4995,20 C4.5305,20 4.5615,19.997 4.5925,19.991 L8.1165,19.326 C8.4145,19.269 8.6855,19.125 8.8965,18.912 L19.5595,8.25 C20.1445,7.665 20.1445,6.713 19.5595,6.128 L19.5595,6.128 Z"></path>
                    </svg>
                </button>
            </div>

            <div class="summary-item">
                <div class="item-img-badge-wrapper">
                    <img src="./images/cart.jpg" alt="Body Cream" class="summary-img">
                    <span class="item-count-badge">1</span>
                </div>
                <div class="summary-item-details">
                    <span class="item-title">Body Cream</span>
                    <span class="item-sku">SKU: 0001</span>
                </div>
                <div class="summary-item-price">$35.00</div>
            </div>

            <div class="summary-promo">
                <svg viewBox="0 0 20 20" fill="currentColor" width="20" height="20" aria-hidden="true">
                    <path fill-rule="evenodd" d="M14.5,3.9997 C15.327,3.9997 16,4.6727 16,5.4997 L16,5.4997 L16,9.6577 C16,10.1847 15.787,10.6997 15.414,11.0727 L15.414,11.0727 L9.925,16.5607 C9.643,16.8437 9.266,16.9997 8.865,16.9997 C8.464,16.9997 8.087,16.8437 7.804,16.5607 L7.804,16.5607 L3.439,12.1957 C2.854,11.6107 2.854,10.6597 3.439,10.0747 L3.439,10.0747 L8.928,4.5857 C9.306,4.2077 9.808,3.9997 10.342,3.9997 L10.342,3.9997 Z M14.5,4.9997 L10.342,4.9997 C10.075,4.9997 9.824,5.1037 9.635,5.2927 L9.635,5.2927 L4.146,10.7817 C3.952,10.9767 3.952,11.2937 4.146,11.4887 L4.146,11.4887 L8.511,15.8537 C8.701,16.0427 9.031,16.0427 9.218,15.8537 L9.218,15.8537 L14.707,10.3657 C14.893,10.1787 15,9.9207 15,9.6577 L15,9.6577 L15,5.4997 C15,5.2237 14.776,4.9997 14.5,4.9997 L14.5,4.9997 Z M11.293,7.293 C11.684,6.902 12.316,6.902 12.707,7.293 C13.098,7.684 13.098,8.316 12.707,8.707 C12.316,9.098 11.684,9.098 11.293,8.707 C10.902,8.316 10.902,7.684 11.293,7.293 Z"></path>
                </svg>
                <span>Enter a promo code</span>
            </div>

            <div class="summary-totals">
                <div class="total-line">
                    <span>Subtotal</span>
                    <span>$35.00</span>
                </div>
                <div class="total-line">
                    <span>Delivery</span>
                    <span>--</span>
                </div>
                <div class="total-line final-total">
                    <span>Total</span>
                    <span>$35.00</span>
                </div>
            </div>
        </section>
    </main>

    <footer class="checkout-footer">
        <div class="secure-checkout">
            <svg width="12" height="14" viewBox="0 0 11 14" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <g fill="currentColor" fill-rule="evenodd">
                    <path d="M0 12.79c0 .558.445 1.01.996 1.01h9.008A1 1 0 0 0 11 12.79V6.01c0-.558-.445-1.01-.996-1.01H.996A1 1 0 0 0 0 6.01v6.78Z"></path>
                    <path d="M9.5 5v-.924C9.5 2.086 7.696.5 5.5.5c-2.196 0-4 1.586-4 3.576V5h1v-.924c0-1.407 1.33-2.576 3-2.576s3 1.17 3 2.576V5h1Z" fill-rule="nonzero"></path>
                </g>
            </svg>
            <span>Secure Checkout</span>
        </div>
    </footer>


    <button class="chat-widget-btn" aria-label="Open Chat">
        <i class="fa-solid fa-comment" aria-hidden="true"></i>
    </button>
</body>
</html>
